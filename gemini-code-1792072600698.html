<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapatería Nova - Catálogo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Zapatería Nova</div>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="responsive.html">Diseño Responsive</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Nuestro Catálogo</h2>
        <div class="grid-catalogo">
            <!-- Zapato 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" alt="Tenis Rojos">
                <h3>Sneakers Urban Red</h3>
                <p class="precio">$1,200 MXN</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <!-- Zapato 2 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500&q=80" alt="Botas Casuales">
                <h3>Botas Casuales de Cuero</h3>
                <p class="precio">$1,850 MXN</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <!-- Zapato 3 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500&q=80" alt="Tenis Vans">
                <h3>Skate Classic Vans</h3>
                <p class="precio">$950 MXN</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <!-- Zapato 4 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500&q=80" alt="Tenis Deportivos">
                <h3>Runner Pro Black</h3>
                <p class="precio">$1,500 MXN</p>
                <button class="btn-comprar">Comprar</button>
            </div>
        </div>
    </main>
</body>
</html>
